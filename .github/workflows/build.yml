name: Build Binaries

on:
  workflow_dispatch:
    inputs:
      custom_version_number:
        description: 'Version'
        required: true
        default: '1.0.0'
        type: string

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.4'

      - name: Run tests
        run: go test -v ./...

  build:
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.4'

      - name: Build binary
        env:
          APP_VERSION: ${{ github.event.inputs.custom_version_number }}
        run: make build-${{ matrix.goos }}-${{ matrix.goarch }}