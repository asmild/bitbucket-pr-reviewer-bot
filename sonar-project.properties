# Project identification
sonar.projectKey=asmild_bitbucket-pr-reviewer-bot
sonar.organization=asmild

# Project metadata
sonar.projectName=Bitbucket PR Reviewer Bot
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=.
sonar.tests=.

# Source file inclusions/exclusions
sonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**,**/build/**,**/templates/**,**/*.yml,**/*.yaml,**/*.md

# Test file inclusions
sonar.test.inclusions=**/*_test.go

# Coverage
sonar.go.coverage.reportPaths=coverage.out

# Language
sonar.language=go

# Encoding
sonar.sourceEncoding=UTF-8
